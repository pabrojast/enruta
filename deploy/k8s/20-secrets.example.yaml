# Plantilla de secrets — NUNCA commitear valores reales.
# En el cluster se crean así (o con scripts/bootstrap-secrets.sh):
#
#   # 1) pull de imágenes desde GHCR (una vez por namespace)
#   kubectl -n enruta create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io --docker-username=pabrojast \
#     --docker-password='<PAT clásico con read:packages>'
#
#   # 2) entorno de la app
#   kubectl -n enruta create secret generic enruta-env \
#     --from-literal=DATABASE_URL='postgresql://enruta:<pw>@pg-shared-rw.databases.svc.cluster.local:5432/enruta' \
#     --from-literal=AUTH_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=AUTH_URL='https://enruta.aquedra.com' \
#     --from-literal=NEXTAUTH_URL='https://enruta.aquedra.com' \
#     --from-literal=DEMO_PASSWORD="$(openssl rand -base64 18)" \
#     --from-literal=SMTP_HOST='smtp.sendgrid.net' \
#     --from-literal=SMTP_PORT='587' \
#     --from-literal=SMTP_USER='apikey' \
#     --from-literal=SMTP_PASS='<SendGrid API key>' \
#     --from-literal=SMTP_FROM='ENRUTA <noreply@aquedra.com>' \
#     --from-literal=AI_BASE_URL='https://ai.creaciv.com/v1' \
#     --from-literal=AI_API_KEY='<key del gateway>' \
#     --from-literal=AI_MODEL='deepseek-r1:8b'
#
apiVersion: v1
kind: Secret
metadata:
  name: enruta-env
  namespace: enruta
type: Opaque
stringData:
  DATABASE_URL: CHANGE_ME
  AUTH_SECRET: CHANGE_ME
  AUTH_URL: https://enruta.aquedra.com
  NEXTAUTH_URL: https://enruta.aquedra.com
  DEMO_PASSWORD: CHANGE_ME
  SMTP_HOST: smtp.sendgrid.net
  SMTP_PORT: "587"
  SMTP_USER: apikey
  SMTP_PASS: CHANGE_ME
  SMTP_FROM: ENRUTA <noreply@aquedra.com>
  AI_BASE_URL: https://ai.creaciv.com/v1
  AI_API_KEY: CHANGE_ME
  AI_MODEL: deepseek-r1:8b
