# DNS: A enruta.aquedra.com -> 65.109.42.248 (LB Hetzner), EN GRIS (DNS only)
# o el reto HTTP-01 no llega y el cert no emite/renueva.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enruta
  namespace: enruta
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [enruta.aquedra.com]
      secretName: enruta-tls
  rules:
    - host: enruta.aquedra.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: enruta
                port:
                  number: 3000
