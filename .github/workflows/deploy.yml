# CI/CD a k3s: quality -> build (GHCR) -> deploy (runner ARC dentro del cluster).
# El runner `enruta-k8s` corre DENTRO del cluster: kubectl usa el token de su
# ServiceAccount (RBAC en deploy/k8s/10-rbac.yaml), no hay kubeconfig en secrets.
name: Deploy to k3s

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-k3s
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit

  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build & push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}-migrate
          cache-from: type=gha

  deploy:
    needs: build
    runs-on: enruta-k8s
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSLo "$HOME/bin/kubectl" "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x "$HOME/bin/kubectl"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Run migrations
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}-migrate"
          kubectl -n enruta delete job enruta-migrate --ignore-not-found
          sed "s|__IMAGE__|$IMAGE|g" deploy/k8s/50-migrate-job.yaml.tpl | kubectl apply -f -
          kubectl -n enruta wait --for=condition=complete job/enruta-migrate --timeout=300s || {
            echo "--- logs del job de migración ---"
            kubectl -n enruta logs job/enruta-migrate --tail=100 || true
            exit 1
          }
      - name: Deploy
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          kubectl -n enruta set image deployment/enruta app="$IMAGE"
          kubectl -n enruta rollout status deployment/enruta --timeout=600s
